<section class="flex">
    <mat-toolbar class="header">
        <button matIconButton class="botonMenu" (click)="sidenav.toggle();"
                [matTooltip]="sidenav.opened ? 'Cerrar menu' : 'Abrir menu'"
                 [disabled]="!logeado()">
                <mat-icon>menu</mat-icon>
        </button>
        <div class="me-4 flex">
            <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger class="botonMenu">
                <mat-icon>person</mat-icon>
            </button>
        </div>
        <mat-menu #menu="matMenu">
            <button mat-menu-item>Iniciar Sesión</button>
            <button mat-menu-item>Cerrar Sesión</button>
            <mat-divider></mat-divider>
            <button mat-menu-item>Cambiar contraseña</button>
        </mat-menu>
    </mat-toolbar>

    <mat-sidenav-container class="container">
        <mat-sidenav #sidenav mode="side" [opened]="logeado()" class="sidenav">
            <mat-nav-list>
                <mat-list-item class="bg-amber-300! rounded-sm!">persona</mat-list-item>
                <hr>
                @for(item of menuItems(); track item.label) {
                    <a mat-list-item [routerLink]="item.route">
                        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
                        <span matListItemTitle>{{item.label}}</span>
                    </a>
                }
            </mat-nav-list>
        </mat-sidenav>
        
        <mat-sidenav-content>
            <router-outlet />
        </mat-sidenav-content>

    </mat-sidenav-container>

    <mat-toolbar class="footer">
        <span class="font-bold! text-[0.65rem]!">
            @2026 Citas Médicas. Todos los derechos reservados.
        </span>
    </mat-toolbar>
</section>
