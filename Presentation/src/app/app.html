<section class="flex">
    <mat-toolbar class="header">
        <button matIconButton class="botonMenu" (click)="sidenav.toggle();"
            [matTooltip]="sidenav.opened ? 'Cerrar menú' : 'Abrir menú'" matTooltipPosition="right"
            [disabled]="!authService.isLoggedIn()">
            <mat-icon>menu</mat-icon>
        </button>
        <div class="me-4 flex">
            <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger class="botonMenu">
                <mat-icon>person</mat-icon>
            </button>
        </div>
        <mat-menu #menu="matMenu">
            <button mat-menu-item [routerLink]="['/login']" [hidden]="authService.isLoggedIn()">Iniciar sesión</button>
            <button mat-menu-item (click)="loggout()" [hidden]="!authService.isLoggedIn()">Cerrar sesión</button>
            <mat-divider></mat-divider>
            <button mat-menu-item [hidden]="!authService.isLoggedIn()">Cambiar contraseña</button>
        </mat-menu>
    </mat-toolbar>

    <mat-sidenav-container class="container">
        <mat-sidenav #sidenav mode="side" class="sidenav" [opened]="authService.isLoggedIn()">
            <mat-nav-list>
                <mat-list-item class="bg-amber-500">Luis West</mat-list-item>
                <hr>
                @for(item of menuItems; track item.label) {
                    <mat-list-item>
                        <a href="" [routerLink]="item.route">
                            <mat-icon>{{item.icon}}</mat-icon>
                            {{item.label}}
                        </a>
                    </mat-list-item>
                }
            </mat-nav-list>            
        </mat-sidenav>
        <mat-sidenav-content>
            <router-outlet />
        </mat-sidenav-content>
    </mat-sidenav-container>
    <mat-toolbar class="footer">
        <span class="font-bold! text-[0.65rem]!">
            @2026 Sistema de citas médicas. Todos los derechos reservados
        </span>
    </mat-toolbar>
</section>
